name: Android

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.${GITHUB_RUN_NUMBER}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          ABLS_VERSION_CODE: ${{ steps.version.outputs.code }}
          ABLS_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: abls-app-home-debug
          path: composeApp/build/outputs/apk/debug/*.apk

      # ---- Release (tag v*) : APK signé si les secrets existent, sinon signé debug ----
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ABLS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ABLS_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ABLS_VERSION_CODE: ${{ steps.version.outputs.code }}
          ABLS_VERSION_NAME: ${{ steps.version.outputs.name }}
          ABLS_KEYSTORE_PASSWORD: ${{ secrets.ABLS_KEYSTORE_PASSWORD }}
          ABLS_KEY_ALIAS: ${{ secrets.ABLS_KEY_ALIAS }}
          ABLS_KEY_PASSWORD: ${{ secrets.ABLS_KEY_PASSWORD }}
        run: |
          ./gradlew :composeApp:assembleRelease --no-daemon
          cp composeApp/build/outputs/apk/release/*.apk "abls-app-home-${{ steps.version.outputs.name }}.apk"

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "abls-app-home-${{ steps.version.outputs.name }}.apk" \
            --title "Abls-Habitat Home ${{ steps.version.outputs.name }}" --generate-notes
